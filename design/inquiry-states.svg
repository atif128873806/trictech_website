<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="690" viewBox="0 0 1020 690"><rect width="1020" height="690" fill="#FFFFFF"/><text x="50" y="66" fill="#1E252B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0" text-anchor="start">Inquiry feedback states</text><text x="50" y="97" fill="#53616B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">Specific, recoverable and accessible. Input stays intact when delivery fails.</text><rect x="50" y="135" width="440" height="470" rx="0" fill="#FFFFFF" stroke="#D9DFE3"/><rect x="530" y="135" width="440" height="470" rx="0" fill="#FFFFFF" stroke="#D9DFE3"/><text x="78" y="183" fill="#1E252B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0" text-anchor="start">Validation error</text><text x="78" y="220" fill="#AA1E2B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" text-anchor="start">Please correct the email address.</text><text x="78" y="270" fill="#1E252B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" text-anchor="start">Corporate email address *</text><rect x="78" y="284" width="384" height="48" rx="2" fill="#FFFFFF" stroke="#AA1E2B"/><text x="94" y="314" fill="#1E252B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">name@</text><text x="78" y="358" fill="#AA1E2B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">Enter a complete business email address.</text><text x="78" y="410" fill="#1E252B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" text-anchor="start">Technical description *</text><rect x="78" y="424" width="384" height="108" rx="2" fill="#FFFFFF" stroke="#D9DFE3"/><text x="94" y="455" fill="#53616B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Existing message remains available.</text><text x="558" y="183" fill="#1E252B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0" text-anchor="start">Delivery could not complete</text><text x="558" y="220" fill="#53616B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">Your details are still here. Please try again,</text><text x="558" y="243" fill="#53616B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">or call or email our team.</text><rect x="558" y="286" width="384" height="145" rx="0" fill="#F5F6F7"/><text x="578" y="328" fill="#1E252B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0" text-anchor="start">Nothing has been lost.</text><text x="578" y="362" fill="#53616B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">Your email, interest and message remain</text><text x="578" y="385" fill="#53616B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start">in the form for a retry.</text><rect x="558" y="475" width="134" height="52" rx="2" fill="#AA1E2B"/><text x="582" y="508" fill="#FFFFFF" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" text-anchor="start">Try again</text><text x="714" y="507" fill="#AA1E2B" font-family="IBM Plex Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" text-anchor="start">Use phone or email  →</text></svg>